# S2 — LiteLLM 게이트웨이: WebUI/향후 클라이언트가 모델명으로 라우팅하는
# OpenAI 호환 진입점. 이미지 arm64 manifest 선검증 완료(ghcr.io/berriai/litellm:v1.93.0,
# ADR-0006 교훈 반영, 2026-07-19).
#
# 2026-07-20 로컬 docker stats 실측: 정상 상태 ~1GB, 512Mi 최초 설정은
# 부족해 상향(기동 직후 953Mi → 안정 1006~1019Mi, 요청 처리 중에도 동일 수준
# — cluster-side 최초 배포에서 512Mi 한도로 OOMKilled 재현·확인).
#
# 마스터키(LITELLM_MASTER_KEY) 미설정 — 로컬 docker 검증에서 인증 없이
# /v1/chat/completions·/v1/models가 200 응답함을 확인(오케스트레이터 사전 검증).
# S2는 배선 단계: 이 슬라이스의 목적은 "모델명 → 백엔드" 라우팅 경로를 세우는
# 것뿐이고, 인증·예산·키 관리 같은 게이트웨이 존재 이유는 모델·백엔드가
# 여러 클라이언트로 늘어나는 실사용 수요가 등장할 때 추가한다(docs/llm-slice-plan.md
# S2 결정). 현재 노출 표면은 ClusterIP(클러스터 내부 전용)라 무인증 리스크는
# 네임스페이스 내부로 한정됨.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm
data:
  config.yaml: |
    model_list:
      - model_name: gemma4-12b
        litellm_params:
          model: ollama/gemma4:12b
          api_base: http://ollama-host.llm.svc.cluster.local:11434
      - model_name: gemma4-26b
        litellm_params:
          model: ollama/gemma4:26b
          api_base: http://ollama-host.llm.svc.cluster.local:11434
      - model_name: gemma4-31b
        litellm_params:
          model: ollama/gemma4:31b
          api_base: http://ollama-host.llm.svc.cluster.local:11434
      - model_name: gemma2-27b
        litellm_params:
          model: ollama/gemma2:27b
          api_base: http://ollama-host.llm.svc.cluster.local:11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.93.0
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--host"
            - "0.0.0.0"
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
