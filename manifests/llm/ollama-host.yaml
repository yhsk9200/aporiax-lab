# S1 — 호스트 Ollama(Metal GPU)를 클러스터 DNS로 노출.
# selector 없는 Service + 수동 Endpoints로 호스트 IPv4를 고정 배선한다.
# HOST_IP(0.250.250.254)는 OrbStack 브리지가 부여한 호스트 주소 —
# VM(mlx-1) 재생성 시 재실측 필요 (getent ahostsv4 host.orb.internal).
# host.orb.internal은 IPv6 우선 응답하지만 파드는 IPv4 단일 스택이라
# IPv4 주소로 고정한다 (2026-07-19 실측, ADR-0009 S1).
apiVersion: v1
kind: Namespace
metadata:
  name: llm
  labels:
    app.kubernetes.io/part-of: aporiax-lab
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-host
  namespace: llm
spec:
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-host
  namespace: llm
subsets:
  - addresses:
      - ip: 0.250.250.254
    ports:
      - port: 11434
