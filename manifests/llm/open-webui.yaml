# S1 — Open WebUI: 기성 UI로 호스트 Ollama에 직결.
# 이미지 태그는 GitHub latest release로 핀 (linux/arm64 manifest 존재
# docker buildx imagetools inspect로 확인, ADR-0006 교훈 반영, 2026-07-19).
# Recreate: SQLite + RWO PVC 조합이라 롤링 시 다중 writer 충돌 방지.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.10.2
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama-host.llm.svc.cluster.local:11434"
            - name: WEBUI_AUTH
              value: "True"
            # S2 — LiteLLM 게이트웨이 경유 커넥터(OpenAI 호환). OLLAMA_BASE_URL은
            # 직결 폴백 경로로 유지(제거하지 않음).
            - name: OPENAI_API_BASE_URL
              value: "http://litellm.llm.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              value: "sk-not-required"   # 마스터키 미설정 — WebUI가 헤더를 요구해서 넣는 placeholder
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
